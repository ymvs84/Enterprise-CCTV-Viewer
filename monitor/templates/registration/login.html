<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login - JCDecaux Security</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0b0c10; color: #fff; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #1f2833; border: 1px solid #45a29e; width: 100%; max-width: 400px; padding: 2rem; border-radius: 8px; box-shadow: 0 0 20px rgba(102, 252, 241, 0.2); }
        .btn-jcd { background-color: #45a29e; color: #0b0c10; font-weight: bold; width: 100%; border: none; }
        .btn-jcd:hover { background-color: #66fcf1; }
        .brand-accent { color: #66fcf1; }
    </style>
</head>
<body>
    <div class="login-card">
        <h3 class="text-center mb-4">🏢 JCDecaux <span class="brand-accent">| SOC</span></h3>
        <p class="text-center text-muted mb-4">Acceso Restringido - Seguridad</p>

        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control bg-dark text-white border-secondary" placeholder="ej: conserjeria" autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control bg-dark text-white border-secondary">
            </div>
            <button type="submit" class="btn btn-jcd py-2">INICIAR SESIÓN 🔐</button>
        </form>
    </div>
</body>
</html>
