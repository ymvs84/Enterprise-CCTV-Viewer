<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel de Control - JCDecaux</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #0b0c10; color: #c5c6c7; font-family: 'Segoe UI', sans-serif; padding-top: 50px; }
        .monitor-btn {
            height: 200px; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            font-size: 1.5rem; border: 2px solid #45a29e;
            background: #1f2833; color: #66fcf1; transition: all 0.3s;
            text-decoration: none; border-radius: 10px;
        }
        .monitor-btn:hover { background: #0b0c10; border-color: #66fcf1; transform: scale(1.05); color: #fff; }
        .icon-screen { font-size: 3rem; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container text-center">
        <h1 class="mb-5">📡 Centro de Control de Seguridad</h1>
        <p class="mb-5 lead">Seleccione la configuración de visualización para este puesto</p>

        <div class="row g-4">
            <div class="col-md-6">
                <a href="/monitor/1/" target="_blank" class="monitor-btn">
                    <div class="icon-screen">🖥️ 1</div>
                    <span>ABRIR MONITOR IZQUIERDO<br><small class="text-muted fs-6">(Cámaras 1 - 6)</small></span>
                </a>
            </div>

            <div class="col-md-6">
                <a href="/monitor/2/" target="_blank" class="monitor-btn">
                    <div class="icon-screen">🖥️ 2</div>
                    <span>ABRIR MONITOR DERECHO<br><small class="text-muted fs-6">(Cámaras 7 - 12)</small></span>
                </a>
            </div>
        </div>

        <div class="mt-5">
            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger btn-sm">Cerrar Sesión</button>
            </form>
        </div>
    </div>
</body>
</html>
